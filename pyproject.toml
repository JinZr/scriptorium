[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptorium"
version = "0.1.0"
description = "Local, durable manuscript review, revision, and verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-codex==0.156.1",
    "pydantic>=2.7,<3",
    "PyMuPDF>=1.24,<2",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
claude = [
    "claude-agent-sdk==0.2.158",
]
antigravity = [
    "google-antigravity==0.1.18",
]
all = [
    "claude-agent-sdk==0.2.158",
    "google-antigravity==0.1.18",
]
dev = [
    "black==26.3.1",
    "build>=1.2,<2",
    "flake8==7.3.0",
    "isort==5.13.2",
    "mccabe==0.7.0",
    "pytest==9.0.3",
]

[project.scripts]
scriptorium = "scriptorium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scriptorium = ["prompts/*.md"]

[tool.black]
line-length = 120
target-version = ["py310"]
exclude = '''
/(\.git|\.venv|\.mypy_cache|\.pytest_cache|build|dist|\.eggs|\.idea|\.vscode|logs|log-[^/]+|outputs)
'''

[tool.isort]
profile = "black"
line_length = 120
default_section = "THIRDPARTY"
known_first_party = ["scriptorium"]
combine_as_imports = true
force_sort_within_sections = true
skip_gitignore = true

[tool.pytest.ini_options]
markers = [
    "live_harness: paid, credentialed native harness integration smoke tests",
]

[tool.scriptorium_complexity]
max_complexity = 20
statement_warning = 80
paths = ["src/scriptorium", "utils/check_complexity.py"]
advisory_paths = ["egs/peerreviewbench"]

[[tool.scriptorium_complexity.debt]]
path = "src/scriptorium/workflow.py"
function = "Armarius._execute_task"
cap = 43
reason = "Attempt execution, correction, and durable completion must preserve lifecycle ordering."

[[tool.scriptorium_complexity.debt]]
path = "src/scriptorium/service.py"
function = "ScriptoriumService.doctor"
cap = 34
reason = "Preflight checks share dependency and diagnostic ordering."

[[tool.scriptorium_complexity.debt]]
path = "src/scriptorium/runtime/contained.py"
function = "ContainedAgentRuntime._invoke"
cap = 29
reason = "Worker ownership and cancellation cleanup must remain coordinated."

[[tool.scriptorium_complexity.debt]]
path = "src/scriptorium/runtime/antigravity.py"
function = "AntigravityAgentRuntime._run"
cap = 23
reason = "Native session execution preserves cancellation and result normalization."

[[tool.scriptorium_complexity.debt]]
path = "src/scriptorium/runtime/claude_code.py"
function = "ClaudeCodeAgentRuntime._run"
cap = 22
reason = "Native session execution preserves interruption and session persistence."

[[tool.scriptorium_complexity.debt]]
path = "src/scriptorium/workflow.py"
function = "Armarius._load_bundle"
cap = 22
reason = "Bundle loading validates frozen source and page evidence before use."

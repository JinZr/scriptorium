[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptorium"
version = "0.1.0"
description = "Codex-native manuscript review, revision, and verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-codex==0.144.4",
    "pydantic>=2.7,<3",
    "PyMuPDF>=1.24,<2",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
    "build>=1.2,<2",
    "flake8==7.3.0",
    "isort==5.13.2",
    "pytest==9.0.3",
]

[project.scripts]
scriptorium = "scriptorium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scriptorium = ["prompts/*.md"]

[tool.black]
line-length = 120
target-version = ["py310"]
exclude = '''
/(\.git|\.venv|\.mypy_cache|\.pytest_cache|build|dist|\.eggs|\.idea|\.vscode|logs|log-[^/]+|outputs)
'''

[tool.isort]
profile = "black"
line_length = 120
default_section = "THIRDPARTY"
known_first_party = ["scriptorium"]
combine_as_imports = true
force_sort_within_sections = true
skip_gitignore = true


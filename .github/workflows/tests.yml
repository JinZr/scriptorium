name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m build

  latex-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-xetex texlive-luatex latexmk
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify real LaTeX dependency fixtures
        run: |
          pdflatex --version
          xelatex --version
          lualatex --version
          latexmk --version
          python -m pytest -q tests/manuscript/test_dependencies_compile.py tests/manuscript/test_compiler_inputs.py
